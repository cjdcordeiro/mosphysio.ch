name: GitHub Pages

# Staging lives on the gh-pages branch:
#   - main is published at the site root
#   - each pull request gets its own preview under /pr-<number>/
#   - a manual run (Actions > GitHub Pages > Run workflow) on main redeploys
#     staging; on any other branch it publishes /branch/<branch-name>/
# Repo setting: Settings > Pages > Source: Deploy from a branch, gh-pages, / (root).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Every job pushes to gh-pages, so run them one at a time.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  staging:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site files
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude .impeccable --exclude PRODUCT.md --exclude DESIGN.md --exclude _site ./ _site/
          touch _site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: |
            pr-*
            branch

  branch-preview:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site files
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude .impeccable --exclude PRODUCT.md --exclude DESIGN.md --exclude _site ./ _site/
      - id: preview
        uses: rajyan/preview-pages@v1
        with:
          source-dir: _site
          target-dir: branch
          branch-per-commit: false
      - name: Show preview link
        run: echo "Preview at https://${{ steps.preview.outputs.pages-url }}/" >> "$GITHUB_STEP_SUMMARY"

  preview:
    # Fork PRs get a read-only token and can't push to gh-pages.
    if: >
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site files
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude .impeccable --exclude PRODUCT.md --exclude DESIGN.md --exclude _site ./ _site/
      - uses: rajyan/preview-pages@v1
        with:
          source-dir: _site
          pr-per-commit: false
          pr-comment: sticky

  cleanup:
    if: >
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Remove the PR preview
        run: |
          rm -rf pr-${{ github.event.number }}
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove preview for pr-${{ github.event.number }}"
            git push
          fi
